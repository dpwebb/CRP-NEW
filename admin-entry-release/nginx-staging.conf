worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 64; }
http {
  access_log off;
  server {
    listen 127.0.0.1:18947;
    server_name staging.creditregulatorpro.com;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location = /admin { return 303 https://admin-staging.creditregulatorpro.com/; }
    location = /admin/ { return 303 https://admin-staging.creditregulatorpro.com/; }
    location = /admin.html { return 303 https://admin-staging.creditregulatorpro.com/; }
    location = /admin.js { return 410; }
    location = /admin.css { return 410; }
    location / { return 404; }
  }
}
